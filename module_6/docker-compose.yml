services:
  db:
    image: 'postgres:17'
    env_file:
      - .env.db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./src/db
    env_file:
      - .env.db
    volumes:
      - ./src/data/applicant_data.json:/db/applicant_data.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  
  rabbitmq:
    image: rabbitmq:3.13-management
    env_file:
      - .env.rmq
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./src/web
    env_file:
      - .env.web
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  worker:
    build: ./src/worker
    env_file:
      - .env.worker
    volumes:
      - ./src/data:/worker/data:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
