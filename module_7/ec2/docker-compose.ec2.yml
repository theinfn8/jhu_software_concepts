services:
  db:
    image: 'postgres:17'
    env_file:
      - .env.db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: theinfn8/module_6:migrate
    env_file:
      - .env.db
    volumes:
      - ./data/applicant_data.json:/db/applicant_data.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  
  rabbitmq:
    image: rabbitmq:3.13-management
    env_file:
      - .env.rmq
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    image: theinfn8/module_6:web
    env_file:
      - .env.web
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  worker:
    image: theinfn8/module_6:worker
    env_file:
      - .env.worker
    volumes:
      - ./data:/worker/data:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
